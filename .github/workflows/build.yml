name: NFC-Card-Generator

on: [push, pull_request]

permissions:
  contents: write

jobs:

  # =====================================================
  # Windows Build
  # =====================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: NFC-Card-Generator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        shell: cmd
        working-directory: NFC-Card-Generator
        run: pyinstaller --clean --onefile --windowed --name NFC-Card-Generator --icon app.ico --add-data "icon.png;." --add-data "templates;templates" --collect-submodules PIL --collect-submodules PyQt6 main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: NFC-Card-Generator-Windows-x86_64
          path: NFC-Card-Generator/dist/

  # =====================================================
  # Linux Build
  # =====================================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        working-directory: NFC-Card-Generator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux executable
        working-directory: NFC-Card-Generator
        run: pyinstaller --clean --onefile --windowed --name NFC-Card-Generator --add-data "icon.png:." --add-data "templates:templates" --collect-submodules PIL --collect-submodules PyQt6 main.py

      - name: Make binary executable
        run: chmod +x NFC-Card-Generator/dist/NFC-Card-Generator

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: NFC-Card-Generator-Linux-x86_64
          path: NFC-Card-Generator/dist/

  # =====================================================
  # macOS Apple Silicon Build
  # =====================================================
  build-macos-apple-silicon:
    name: Build macOS Apple Silicon
    runs-on: macos-14

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        working-directory: NFC-Card-Generator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Import Apple Developer ID certificate
        if: github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "Missing macOS signing certificate secrets."
            exit 1
          fi

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Convert PNG icon to ICNS
        working-directory: NFC-Card-Generator
        run: |
          mkdir -p app.iconset
          sips -z 16 16 icon.png --out app.iconset/icon_16x16.png
          sips -z 32 32 icon.png --out app.iconset/icon_16x16@2x.png
          sips -z 32 32 icon.png --out app.iconset/icon_32x32.png
          sips -z 64 64 icon.png --out app.iconset/icon_32x32@2x.png
          sips -z 128 128 icon.png --out app.iconset/icon_128x128.png
          sips -z 256 256 icon.png --out app.iconset/icon_128x128@2x.png
          sips -z 256 256 icon.png --out app.iconset/icon_256x256.png
          sips -z 512 512 icon.png --out app.iconset/icon_256x256@2x.png
          sips -z 512 512 icon.png --out app.iconset/icon_512x512.png
          sips -z 1024 1024 icon.png --out app.iconset/icon_512x512@2x.png
          iconutil -c icns app.iconset -o app.icns

      - name: Build macOS app
        working-directory: NFC-Card-Generator
        run: pyinstaller --clean --windowed --name NFC-Card-Generator --icon app.icns --add-data "icon.png:." --add-data "templates:templates" --collect-submodules PIL --collect-submodules PyQt6 main.py

      - name: Sign macOS app
        if: github.event_name != 'pull_request'
        working-directory: NFC-Card-Generator
        run: |
          codesign --force --deep --options runtime --timestamp \
            --entitlements entitlements.plist \
            --sign "Developer ID Application: Bjorn Logan (SMNGA44VUR)" \
            dist/NFC-Card-Generator.app

          codesign --verify --deep --strict --verbose=2 dist/NFC-Card-Generator.app

      - name: Create DMG
        working-directory: NFC-Card-Generator
        run: |
          mkdir -p dmg
          cp -R dist/NFC-Card-Generator.app dmg/
          hdiutil create -volname "NFC Card Generator" -srcfolder dmg -ov -format UDZO dist/NFC-Card-Generator-macOS-Apple-Silicon.dmg

      - name: Sign macOS DMG
        if: github.event_name != 'pull_request'
        working-directory: NFC-Card-Generator
        run: |
          codesign --force --timestamp \
            --sign "Developer ID Application: Bjorn Logan (SMNGA44VUR)" \
            dist/NFC-Card-Generator-macOS-Apple-Silicon.dmg

          codesign --verify --verbose=2 dist/NFC-Card-Generator-macOS-Apple-Silicon.dmg

      - name: Notarize macOS DMG
        if: github.event_name != 'pull_request'
        working-directory: NFC-Card-Generator
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "Missing Apple notarization secrets."
            exit 1
          fi

          xcrun notarytool submit dist/NFC-Card-Generator-macOS-Apple-Silicon.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

      - name: Staple and validate macOS DMG
        if: github.event_name != 'pull_request'
        working-directory: NFC-Card-Generator
        run: |
          xcrun stapler staple dist/NFC-Card-Generator-macOS-Apple-Silicon.dmg
          xcrun stapler validate dist/NFC-Card-Generator-macOS-Apple-Silicon.dmg
          spctl -a -t open --context context:primary-signature -v dist/NFC-Card-Generator-macOS-Apple-Silicon.dmg

      - name: Upload macOS Apple Silicon artifact
        uses: actions/upload-artifact@v6
        with:
          name: NFC-Card-Generator-macOS-Apple-Silicon
          path: NFC-Card-Generator/dist/NFC-Card-Generator-macOS-Apple-Silicon.dmg

  # =====================================================
  # Release
  # =====================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos-apple-silicon]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create Windows ZIP
        run: |
          cd dist/NFC-Card-Generator-Windows-x86_64
          zip -r ../../NFC-Card-Generator-Windows-x86_64.zip .

      - name: Create Linux tar.gz
        run: |
          cd dist/NFC-Card-Generator-Linux-x86_64
          tar -czvf ../../NFC-Card-Generator-Linux-x86_64.tar.gz .

      - name: Copy macOS Apple Silicon DMG
        run: |
          cp dist/NFC-Card-Generator-macOS-Apple-Silicon/NFC-Card-Generator-macOS-Apple-Silicon.dmg ./NFC-Card-Generator-macOS-Apple-Silicon.dmg

      - name: Update Git Tag
        run: |
          git tag -f Pre-release
          git push -f origin Pre-release

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          tag: Pre-release
          artifacts: |
            NFC-Card-Generator-Windows-x86_64.zip
            NFC-Card-Generator-Linux-x86_64.tar.gz
            NFC-Card-Generator-macOS-Apple-Silicon.dmg