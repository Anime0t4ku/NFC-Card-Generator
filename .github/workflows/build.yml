name: NFC-Card-Generator

on: [push, pull_request]

permissions:
  contents: write

jobs:

  # =====================================================
  # Windows Build
  # =====================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        shell: cmd
        working-directory: NFC-Card-Generator
        run: pyinstaller --clean nfc-card-generator.py --onefile --noconsole --add-data "icon.png;." --add-data "templates;templates" --hidden-import=PIL._tkinter_finder --hidden-import=PIL.ImageTk --collect-submodules=PIL --icon app.ico

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: NFC-Card-Generator-Windows-x86_64
          path: NFC-Card-Generator/dist/

  # =====================================================
  # Linux Build (Tkinter + Pillow fixed)
  # =====================================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux executable
        working-directory: NFC-Card-Generator
        run: pyinstaller --clean nfc-card-generator.py --onefile --noconsole --add-data "icon.png:." --add-data "templates:templates" --hidden-import=PIL._tkinter_finder --hidden-import=PIL.ImageTk --collect-submodules=PIL

      - name: Make binary executable
        run: chmod +x NFC-Card-Generator/dist/nfc-card-generator

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: NFC-Card-Generator-Linux-x86_64
          path: NFC-Card-Generator/dist/

  # =====================================================
  # Release
  # =====================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create Windows ZIP
        run: |
          cd dist/NFC-Card-Generator-Windows-x86_64
          zip -r ../../NFC-Card-Generator-Windows-x86_64.zip .

      - name: Create Linux tar.gz
        run: |
          cd dist/NFC-Card-Generator-Linux-x86_64
          tar -czvf ../../NFC-Card-Generator-Linux-x86_64.tar.gz .

      - name: Update Git Tag
        run: |
          git tag -f Pre-release
          git push -f origin Pre-release

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          tag: Pre-release
          artifacts: |
            NFC-Card-Generator-Windows-x86_64.zip
            NFC-Card-Generator-Linux-x86_64.tar.gz
